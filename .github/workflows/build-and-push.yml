name: Build and push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Build and push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: so
          - variant: act
    environment: lightview-${{ matrix.variant }}
    labels: |
      org.simonsobs.lightview.${{ matrix.variant }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.variant }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AUTH_ENABLED=${{ vars.VITE_AUTH_ENABLED }}
            VITE_SERVICE_URL=${{ vars.VITE_SERVICE_URL }}
            VITE_ORGANIZATION_NAME=${{ vars.VITE_ORGANIZATION_NAME }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
            VITE_LOGIN_SERVICE=${{ vars.VITE_LOGIN_SERVICE }}
            VITE_LOGOUT_SERVICE=${{ vars.VITE_LOGOUT_SERVICE }}
            VITE_CROSSMATCH_ENABLED=${{ vars.VITE_CROSSMATCH_ENABLED }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
